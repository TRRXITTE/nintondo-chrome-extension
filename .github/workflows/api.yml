name: api

on:
  push:
    paths:
      - 'production-api/**'
      - 'package.json'
      - 'yarn.lock'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'production-api/**'
      - 'package.json'
      - 'yarn.lock'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn api:dev --help || true
